<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CRM — Логика Дома</title>
<link rel="icon" href="brand/favicon-32.png" type="image/png"><link rel="apple-touch-icon" href="brand/apple-touch-icon.png"><meta name="theme-color" content="#19317B">
<link rel="stylesheet" href="brand/ld.css">
<style>
:root{--bg:var(--ld-soft-bg);--panel:#fff;--ink:var(--ld-graphite);--muted:var(--ld-gray-600);--line:var(--ld-tech-gray);--brand:var(--ld-navy);--soft:var(--ld-navy-50);--accent:var(--ld-blue);--accent-soft:var(--ld-blue-50);--ok:var(--ld-green);--err:var(--ld-coral);--warn:var(--ld-orange);
  --display:var(--font-display);--text:var(--font-body);--mono:var(--font-display)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--text);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--brand);background:var(--panel);color:var(--brand);border-radius:6px;padding:7px 14px;font:600 13px/1.1 var(--text);cursor:pointer;white-space:nowrap;transition:background .12s}.btn:hover{background:var(--soft)}
a.btn{text-decoration:none;color:inherit;display:inline-block}.btn.primary{background:var(--brand);border-color:transparent;color:#fff}.btn.primary:hover{background:var(--ld-navy-700)}.btn.gold{background:var(--brand);border-color:transparent;color:#fff}.btn.sm{padding:3px 10px;font-size:12.5px}.btn.ghost{border-color:var(--line)}
input,select,textarea{border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:#fff;width:100%}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ld-blue);box-shadow:var(--focus-ring)}
input[type=checkbox]{width:auto}
label.f{display:grid;gap:3px;font-size:12px;color:var(--muted)}label.f>*{color:var(--ink);font-size:14px}
.top{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.top b{font:700 15px/1 var(--display);color:var(--brand);padding-left:12px;border-left:1px solid var(--line)}.top .sp{flex:1}
.wrap{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 57px)}
.nav{background:var(--panel);border-right:1px solid var(--line);padding:12px;display:grid;align-content:start;gap:2px}
.nav button{border:0;background:none;text-align:left;padding:9px 12px;border-radius:6px;font:500 14px var(--text);color:var(--ink);cursor:pointer;border-left:2px solid transparent}.nav button:hover{background:var(--bg)}.nav button[aria-current="true"]{background:var(--soft);color:var(--brand);font-weight:600;border-left-color:var(--ld-cyan)}
main{padding:18px 22px;min-width:0}
h1{font:700 28px/1.15 var(--display);margin:0 0 14px;color:var(--brand);letter-spacing:-.01em}h2{font:600 18px/1.25 var(--display);color:var(--brand);margin:18px 0 8px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-card);padding:14px;margin-bottom:14px}
table{border-collapse:collapse;width:100%;background:var(--panel)}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:600 11px var(--text);letter-spacing:.04em;text-transform:uppercase;color:var(--ld-gray-500);background:var(--ld-soft-bg);position:sticky;top:0}
tr.click{cursor:pointer}tr.click:hover{background:var(--soft)}
.num{text-align:right;font-family:var(--mono);white-space:nowrap}
.badge{display:inline-block;border-radius:4px;padding:2px 8px;font:600 12px var(--text);background:var(--ld-soft-bg)}
.badge.hot{background:var(--ld-coral-50);color:#B8324D}.badge.warm{background:var(--ld-orange-50);color:#A35F12}.badge.cold{background:var(--ld-blue-50);color:var(--ld-navy)}
.badge.approved{background:var(--ld-cyan-50);color:#13807F}.badge.pending{background:var(--ld-orange-50);color:#A35F12}.badge.rejected{background:var(--ld-coral-50);color:#B8324D}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tabs{display:flex;gap:4px;margin:10px 0}.tabs button{border:0;border-bottom:2px solid transparent;background:none;border-radius:0;padding:8px 2px;margin-right:18px;font:500 14px var(--text);color:var(--ink);cursor:pointer}.tabs button[aria-pressed="true"]{color:var(--brand);font-weight:600;border-bottom-color:var(--ld-cyan)}
.muted{color:var(--muted)}.err{color:var(--err)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs img{height:150px;border:1px solid var(--line);border-radius:8px;background:#fff}
.est td input{width:90px;text-align:right;font-family:var(--mono);padding:3px 6px}.est tr.man td{background:#fff8e8}.est tr.g td{background:var(--soft);font-weight:700}
.kpi{display:flex;gap:14px;flex-wrap:wrap}.kpi div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px;font-size:12px;color:var(--ld-gray-500)}.kpi b{display:block;font:700 26px/1.1 var(--display);color:var(--brand);margin-top:4px}
.login{max-width:400px;margin:12vh auto;background:var(--panel);border-radius:12px;box-shadow:var(--shadow-card);padding:26px;display:grid;gap:12px;border:1px solid var(--line)}
.timeline div{border-left:3px solid var(--line);padding:4px 10px;margin:4px 0}.timeline small{color:var(--muted)}
@media (max-width:760px){.top{padding:8px 12px;gap:10px}#who{display:none}.wrap{grid-template-columns:1fr}.nav{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.nav button{white-space:nowrap}main{padding:12px;overflow-x:auto}.grid2,.grid3{grid-template-columns:1fr}}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.pcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;display:grid}.pcard img,.pcard .noimg{width:100%;height:150px;object-fit:cover;background:var(--soft);display:block}.pcard .pb{padding:10px 12px;display:grid;gap:4px}.pcard.blocked{opacity:.55}.pcard .boost{color:#8a5a00;font-weight:700}
.qlist li.err{color:var(--err)}.qlist li.warn{color:var(--warn)}

/* CMS */
.cms-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;position:sticky;top:0;z-index:4;background:var(--bg);padding:6px 0}
.cms-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}.cms-side{position:sticky;top:60px;display:grid;gap:0}
.cms-fields{display:grid;gap:10px}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:0}.blk>header{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:#fafafa;border-radius:14px 14px 0 0}
.blk>header button{border:0;background:none;cursor:pointer;font-size:15px;padding:2px 6px;border-radius:6px;color:var(--muted)}.blk>header button:hover{background:var(--soft);color:var(--ink)}
.blk .bb{padding:12px;display:grid;gap:10px}.blk.folded .bb{display:none}.bsum{font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:360px}
.bi{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--brand);color:#fff;font-size:13px;font-weight:700}
.addb{display:flex;justify-content:center;margin:6px 0}.addb button{border:1.5px dashed var(--line);background:transparent;border-radius:999px;padding:3px 14px;color:var(--muted);cursor:pointer;font-weight:700}.addb button:hover{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.rt-bar{display:flex;flex-wrap:wrap;gap:2px;border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;padding:4px;background:#fafafa}.rt-bar button{border:0;background:none;min-width:28px;padding:3px 6px;border-radius:6px;cursor:pointer;font-weight:700}.rt-bar button:hover{background:var(--soft)}
.rt-bar .sep{width:1px;background:var(--line);margin:3px 4px}.rt img{max-width:100%;border-radius:8px}.rt pre{background:#2b2e33;color:#eee;padding:8px 10px;border-radius:8px;font:12.5px var(--mono);white-space:pre-wrap}.rt code{background:var(--soft);padding:0 4px;border-radius:4px;font-family:var(--mono)}.rt mark{background:#fde9a8}
.plist{display:grid;gap:6px}.plist button{display:grid;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer}.plist button:hover{border-color:var(--brand)}.plist button:disabled{opacity:.45}.plist small{color:var(--muted)}
.plinks{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}.chip{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:999px;padding:3px 6px 3px 10px;font-size:13px}.chip button{border:0;background:none;cursor:pointer;color:var(--muted)}
.mico{height:110px;display:grid;place-items:center;font-size:40px;background:var(--soft);cursor:pointer}.mediaf audio,.mediaf video{width:100%;margin-top:6px}
.pv-host{width:100%;background:#fff;border-radius:10px;overflow:auto;transition:width .2s;max-height:100%}
.rt{border:1px solid var(--line);border-radius:0 0 10px 10px;padding:10px 12px;min-height:120px;background:#fff;outline:none;line-height:1.55}.rt:focus{border-color:var(--brand)}.rt h2{font:800 24px/1.1 var(--display);margin:12px 0 6px}.rt h3{font-size:16px;margin:10px 0 4px}.rt blockquote{border-left:3px solid var(--accent);margin:8px 0;padding-left:10px;color:var(--muted)}
.items{display:grid;gap:8px}.item{border:1px dashed var(--line);border-radius:10px;padding:8px;display:grid;gap:6px}
.imgf .thumb{max-height:90px;max-width:100%;border-radius:8px;border:1px solid var(--line);margin-top:4px;object-fit:cover}
.snip{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px;background:#fff}.sn-t{color:#1a0dab;font-size:16px;line-height:1.3}.sn-u{color:#006621;font-size:12.5px;margin:2px 0}.sn-d{font-size:13px;color:#4d5156}
.seol{list-style:none;margin:0;padding:0;display:grid;gap:6px}.seol li{display:grid;gap:2px;padding-left:20px;position:relative;font-size:13px}.seol li::before{content:"✓";position:absolute;left:0;color:var(--ok);font-weight:700}.seol li.no::before{content:"!";color:var(--warn)}.seol li span{color:var(--muted);font-size:12px}
.cms-modal{position:fixed;inset:0;background:rgba(31,33,37,.45);z-index:50;display:grid;place-items:center;padding:20px}
.cms-pal{background:var(--panel);border-radius:18px;padding:16px;width:min(920px,100%);max-height:88vh;overflow:auto;display:grid;gap:12px}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}.pal button{display:grid;grid-template-columns:30px 1fr;gap:2px 10px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;cursor:pointer}.pal button:hover{border-color:var(--brand)}.pal .bi{grid-row:span 2}.pal small{color:var(--muted);font-size:12px}
.cms-prev{background:var(--panel);border-radius:18px;padding:12px;width:min(1280px,100%);height:90vh;display:grid;grid-template-rows:auto 1fr;gap:10px}.pv-wrap{background:var(--soft);border-radius:12px;display:flex;justify-content:center;overflow:auto}.pv-wrap iframe{width:100%;height:100%;border:0;background:#fff;border-radius:10px;transition:width .2s}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.media figure{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}.media img{width:100%;height:110px;object-fit:cover;display:block;cursor:pointer}.media figcaption{display:grid;gap:4px;padding:6px 8px}.media figcaption small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.media figcaption span{display:flex;gap:4px}
@media (max-width:1100px){.cms-grid{grid-template-columns:1fr}.cms-side{position:static}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ld-navy-900);color:#fff;padding:10px 18px;border-radius:8px;font-weight:500;box-shadow:var(--shadow-pop);z-index:60}
.demo-box{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-color:var(--ld-orange,#F49A38);background:#FFF8EF}.demo-box>div{flex:1;min-width:260px}
</style>
</head>
<body>
<div id="loginView" class="login" hidden>
  <div class="row" style="gap:14px"><img src="brand/logo-horizontal.svg" alt="Логика Дома" style="height:40px;display:block"><b style="font:700 18px var(--display);color:var(--brand)">CRM</b></div>
  <div class="muted">Корпоративный вход для сотрудников: менеджеров, сметчиков, администраторов.</div>
  <form id="loginForm" style="display:grid;gap:10px"><label class="f">Эл. почта<input name="email" type="email" required></label><label class="f">Пароль<input name="password" type="password" required></label><button class="btn primary">Войти</button><div class="err" id="loginErr"></div></form>
</div>
<div id="appView" hidden>
  <div class="top"><img src="brand/logo-horizontal.svg" alt="Логика Дома" style="height:30px;display:block"><b>CRM</b><span class="sp"></span><span id="who" class="muted"></span><a class="btn sm ghost" href="/">На сайт</a><button class="btn sm" id="logout">Выйти</button></div>
  <div class="wrap">
    <nav class="nav" id="nav"><button data-s="leads">Заявки</button><button data-s="projects">Проекты</button><button data-s="companies">Компании и архитекторы</button><button data-s="prices">Цены материалов</button><button data-s="grid">Сетка цены лида</button><button data-s="viz">Визуализации</button><button data-s="content">Контент сайта</button><button data-s="outbox">Почта</button><button data-s="staff">Сотрудники</button></nav>
    <main id="main"></main>
  </div>
</div>
<script src="js/config.js"></script>
<script src="js/icons.js"></script>
<script src="js/model.js"></script>
<script src="js/furniture.js"></script>
<script src="js/facade.js"></script>
<script src="js/estimate.js"></script>
<script src="js/site.js"></script>
<script src="js/export-cad.js"></script>
<script src="js/cms-ui.js"></script>
<script src="js/crm.js"></script>
</body>
</html>
