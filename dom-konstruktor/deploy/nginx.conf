# Лимит запросов к API: 20 в секунду с адреса (зона объявляется вне server)
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

# /etc/nginx/sites-available/logika-doma  → ln -s в sites-enabled, затем: certbot --nginx -d logikadoma.ru -d www.logikadoma.ru
server {
    listen 80;
    server_name logikadoma.ru www.logikadoma.ru;
    return 301 https://logikadoma.ru$request_uri;
}
server {
    listen 443 ssl http2;
    server_name logikadoma.ru;
    # сертификаты выпустит certbot (Let's Encrypt, бесплатно)
    ssl_certificate     /etc/letsencrypt/live/logikadoma.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logikadoma.ru/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 60m;          # проекты с картинками, видео в медиатеке
    gzip on; gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml;



    location /api/ { limit_req zone=api burst=40 nodelay; proxy_pass http://127.0.0.1:8080; include /etc/nginx/proxy_params; proxy_read_timeout 60s; }

    # библиотеки, шрифты и медиатека — из кеша nginx
    location /vendor/ { proxy_pass http://127.0.0.1:8080; include /etc/nginx/proxy_params; expires 30d; }
    location /media/  { proxy_pass http://127.0.0.1:8080; include /etc/nginx/proxy_params; expires 7d; }
    location / { proxy_pass http://127.0.0.1:8080; include /etc/nginx/proxy_params; }
}
