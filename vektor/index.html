<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вектор — графический редактор</title>
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="build/icon.png">
<script>try { document.documentElement.dataset.theme = localStorage.getItem('vektor.theme') || 'light'; } catch (e) { }</script>
</head>
<body>
<div id="app">
  <div id="menubar" class="menubar"></div>
  <div id="stdbar" class="stdbar"></div>
  <div id="propbar" class="propbar"></div>
  <div id="toolbox" class="toolbox"></div>
  <div id="canvasWrap" class="canvaswrap">
    <div class="rcorner" title="Двойной щелчок по линейке — направляющие"></div>
    <canvas id="rulerTop" class="ruler top" title="Потяните вниз — горизонтальная направляющая"></canvas>
    <canvas id="rulerLeft" class="ruler left" title="Потяните вправо — вертикальная направляющая"></canvas>
    <svg id="stage" class="stage" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="gridPattern" patternUnits="userSpaceOnUse" width="5" height="5"><path id="gridPath" d="M5 0H0V5" fill="none" stroke="#b9c7d8"/></pattern>
        <g id="docDefs"></g>
        <g id="previewDefs"></g>
      </defs>
      <g id="viewport">
        <rect id="pageShadow" fill="rgba(0,0,0,.28)"/>
        <rect id="page" fill="#fff"/>
        <rect id="gridRect" fill="url(#gridPattern)" pointer-events="none"/>
        <rect id="pageBorder" fill="none" stroke="#444" pointer-events="none"/>
        <g id="docG"></g>
        <g id="previewG" pointer-events="none" opacity=".85"></g>
      </g>
      <g id="overlay" pointer-events="none"></g>
    </svg>
    <textarea id="textEditor" spellcheck="false" wrap="off"></textarea>
    <div id="pagebar" class="pagebar"></div>
  </div>
  <div id="docker" class="docker"></div>
  <div id="palette" class="palette"></div>
  <div id="docPalette" class="docpalette"></div>
  <div id="statusbar" class="statusbar">
    <span id="stCoords" class="st-coords">0, 0 мм</span>
    <span id="stInfo" class="st-info"></span>
    <span class="st-paint" ondblclick="UI.docker('props')" title="Двойной щелчок — свойства">
      <span id="stFill" class="st-fill"></span>
      <span id="stStroke" class="st-stroke"></span>
    </span>
  </div>
</div>
<svg id="measureSvg" width="0" height="0" style="position:absolute;left:-9999px;top:-9999px;visibility:hidden"><g id="measure"></g></svg>
<div id="toasts" class="toasts"></div>

<script src="vendor/polygon-clipping.umd.min.js"></script>
<script src="vendor/clipper.js"></script>
<script src="vendor/opentype.min.js"></script>
<script src="vendor/fflate.min.js"></script>
<script src="vendor/cdr-palettes.js"></script>
<script src="fonts/fonts.js"></script>
<script src="js/cmyk-lut.js"></script>
<script src="js/geom.js"></script>
<script src="js/text.js"></script>
<script src="js/effects.js"></script>
<script src="js/model.js"></script>
<script src="js/app.js"></script>
<script src="js/actions.js"></script>
<script src="js/tools.js"></script>
<script src="js/ui.js"></script>
<script src="js/host.js"></script>
<script src="js/io.js"></script>
<script src="js/pdfimport.js"></script>
<script src="js/cdr.js"></script>
<script src="js/agent.js"></script>
<script src="js/polza.js"></script>
<script src="js/workspaces.js"></script>
<script src="js/motion.js"></script>
<script src="js/nodes.js"></script>
<script src="js/make.js"></script>
<script>App.init(); WS.init();</script>
</body>
</html>
