<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Логика Дома — платформа</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script><script src="data.js"></script>
<style>body{min-width:1100px}</style></head><body><div id="root"></div>
<script type="text/babel" src="Shared.jsx"></script>
<script type="text/babel" src="Home.jsx"></script>
<script type="text/babel" src="Catalog.jsx"></script>
<script type="text/babel" src="ProjectPage.jsx"></script>
<script type="text/babel" src="ContractorPage.jsx"></script>
<script type="text/babel">
const NAVMAP={'Проекты':'catalog','Подрядчики':'contractor'};
function App(){
  const saved=JSON.parse(localStorage.getItem('ld-kit-route')||'{"page":"home"}');
  const [r,setR]=React.useState(saved);
  const go=(page,id)=>{const n={page,id};setR(n);localStorage.setItem('ld-kit-route',JSON.stringify(n));window.scrollTo(0,0)};
  const active={catalog:'Проекты',project:'Проекты',contractor:'Подрядчики'}[r.page];
  const P={home:Home,catalog:Catalog,project:ProjectPage,contractor:ContractorPage}[r.page]||Home;
  return <div style={{background:'var(--surface-soft)',minHeight:'100vh'}}>
    <NSX.Header logoSrc={LOGO} active={active} onLogo={()=>go('home')} onNavigate={n=>go(NAVMAP[n]||'home')} style={{position:'sticky',top:0,zIndex:10}}/>
    <P go={go} id={r.id}/><Footer/>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
