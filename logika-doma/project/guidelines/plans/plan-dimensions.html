<!-- @dsCard group="Планировки" viewport="700x200" name="Размерные линии" subtitle="Цепочки снаружи контура, общий размер последним" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:20px;box-sizing:border-box;font:var(--text-secondary-font);font-variant-numeric:tabular-nums}.cap{font:500 12px/1.3 var(--font-body)}.mut{font:12px/1.35 var(--font-body);color:var(--text-muted)}.h{font:700 15px var(--font-display);color:var(--text-heading)}.ok{color:var(--plan-ok);font-weight:600}.no{color:var(--plan-error);font-weight:600}
.node{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--ld-navy);color:#fff;font:600 10px/18px var(--font-display);text-align:center;flex:none}
.ex{background:#fff;border:1px solid var(--border-default);border-radius:8px;box-shadow:var(--shadow-card);padding:12px 14px 10px;font:13px/1.3 var(--font-body)}.ex .r{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:3px 0;border-bottom:1px solid var(--grid-line)}.ex .r .node{width:18px;height:18px;background:var(--ld-navy-50);color:var(--ld-navy)}.ex .r .node.w{background:var(--ld-blue-50)}.ex .g{font:600 10px var(--font-body);letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);margin:6px 0 2px}.ex .t{display:flex;justify-content:space-between;margin-top:6px;font:600 13px var(--font-display);color:var(--text-heading)}
.tb{display:grid;grid-template-columns:48px 1fr 70px;grid-template-rows:1fr 1fr;border:1.5px solid var(--sheet-frame);background:#fff}.tb>div{display:flex;align-items:center;padding:0 8px}.tb .lg{grid-row:1/3;justify-content:center}.tb .p{grid-row:1/3;border-left:1.5px solid var(--sheet-frame);flex-direction:column;justify-content:center}.tb .a{border-left:1.5px solid var(--sheet-frame);border-bottom:1px solid var(--sheet-frame);font:700 10px var(--font-display);color:var(--ld-navy)}.tb .b{border-left:1.5px solid var(--sheet-frame);font:500 9px var(--font-body)}
</style></head><body><div style="display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center">
<div style="position:relative;height:150px">
<div style="position:absolute;left:10px;right:10px;top:46px;height:70px;background:var(--plan-wall-ext);background-image:repeating-linear-gradient(45deg,var(--plan-wall-ext-hatch) 0 1px,transparent 1px 6px)"></div>
<div style="position:absolute;top:18px;left:calc(10px + 0% * .82 / .82);width:57%;border-top:1px solid var(--plan-dim);text-align:center;font:9px var(--font-body);color:var(--plan-dim);padding-top:0"><span style="position:relative;top:-13px">5700</span></div><div style="position:absolute;top:18px;left:calc(10px + 57% * .82 / .82);width:14%;border-top:1px solid var(--plan-dim);text-align:center;font:9px var(--font-body);color:var(--plan-dim);padding-top:0"><span style="position:relative;top:-13px">1400</span></div><div style="position:absolute;top:18px;left:calc(10px + 71% * .82 / .82);width:11%;border-top:1px solid var(--plan-dim);text-align:center;font:9px var(--font-body);color:var(--plan-dim);padding-top:0"><span style="position:relative;top:-13px">1100</span></div>
<div style="position:absolute;top:4px;left:10px;width:82%;border-top:1px solid var(--plan-dim)"><span style="position:absolute;left:50%;top:-13px;transform:translateX(-50%);font:600 9px var(--font-body);color:var(--plan-line)">8200</span></div>
<span style="position:absolute;top:0;left:calc(10px + 0%);height:24px;border-left:1px solid var(--plan-dim);transform:skewX(-45deg)"></span><span style="position:absolute;top:0;left:calc(10px + 57%);height:24px;border-left:1px solid var(--plan-dim);transform:skewX(-45deg)"></span><span style="position:absolute;top:0;left:calc(10px + 71%);height:24px;border-left:1px solid var(--plan-dim);transform:skewX(-45deg)"></span><span style="position:absolute;top:0;left:calc(10px + 82%);height:24px;border-left:1px solid var(--plan-dim);transform:skewX(-45deg)"></span>
</div>
<div style="display:flex;flex-direction:column;gap:6px;font:13px/1.4 var(--font-body)">
<div>— Линия 0,25 мм, засечки 45° (не стрелки), цвет <code>--plan-dim</code>.</div>
<div>— Числа в мм без единиц, Inter 6,5 pt, над линией, по центру отрезка.</div>
<div>— 1-я цепочка — проёмы, 2-я — оси/стены, 3-я — общий габарит (полужирный).</div>
<div>— Шаг между цепочками 7 мм. Текст не пересекает линии и марки.</div></div></div></body></html>
