<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:20px;box-sizing:border-box;font:var(--text-secondary-font);font-variant-numeric:tabular-nums}.cap{font:500 12px/1.3 var(--font-body)}.mut{font:12px/1.35 var(--font-body);color:var(--text-muted)}.h{font:700 15px var(--font-display);color:var(--text-heading)}.ok{color:var(--plan-ok);font-weight:600}.no{color:var(--plan-error);font-weight:600}
.node{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--ld-navy);color:#fff;font:600 10px/18px var(--font-display);text-align:center;flex:none}
.ex{background:#fff;border:1px solid var(--border-default);border-radius:8px;box-shadow:var(--shadow-card);padding:12px 14px 10px;font:13px/1.3 var(--font-body)}.ex .r{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:3px 0;border-bottom:1px solid var(--grid-line)}.ex .r .node{width:18px;height:18px;background:var(--ld-navy-50);color:var(--ld-navy)}.ex .r .node.w{background:var(--ld-blue-50)}.ex .g{font:600 10px var(--font-body);letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);margin:6px 0 2px}.ex .t{display:flex;justify-content:space-between;margin-top:6px;font:600 13px var(--font-display);color:var(--text-heading)}
.tb{display:grid;grid-template-columns:48px 1fr 70px;grid-template-rows:1fr 1fr;border:1.5px solid var(--sheet-frame);background:#fff}.tb>div{display:flex;align-items:center;padding:0 8px}.tb .lg{grid-row:1/3;justify-content:center}.tb .p{grid-row:1/3;border-left:1.5px solid var(--sheet-frame);flex-direction:column;justify-content:center}.tb .a{border-left:1.5px solid var(--sheet-frame);border-bottom:1px solid var(--sheet-frame);font:700 10px var(--font-display);color:var(--ld-navy)}.tb .b{border-left:1.5px solid var(--sheet-frame);font:500 9px var(--font-body)}
</style></head><body><div style="display:flex;gap:14px">
<div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="position:relative;height:120px;border-radius:6px;border:1px solid var(--border-default);background:url(../../assets/images/site-plan-f1.png) -1120px -150px/2262px no-repeat #fff"><span style="position:absolute;top:6px;left:6px;width:20px;height:20px;border-radius:50%;background:var(--plan-error);color:#fff;font:700 13px/20px var(--font-body);text-align:center">✕</span></div><div class="cap">Текст поверх размеров</div><div class="mut">«Терраса 29,8 м²» наложена на цепочку 12000</div></div>
<div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="position:relative;height:120px;border-radius:6px;border:1px solid var(--border-default);background:url(../../assets/images/site-plan-f1.png) -760px -860px/2262px no-repeat #fff"><span style="position:absolute;top:6px;left:6px;width:20px;height:20px;border-radius:50%;background:var(--plan-error);color:#fff;font:700 13px/20px var(--font-body);text-align:center">✕</span></div><div class="cap">Марка на круге-заглушке</div><div class="mut">Подпись перекрывает жёлтый маркер и мебель</div></div>
<div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="position:relative;height:120px;border-radius:6px;border:1px solid var(--border-default);background:url(../../assets/images/site-plan-f1.png) -1820px -20px/2262px no-repeat #fff"><span style="position:absolute;top:6px;left:6px;width:20px;height:20px;border-radius:50%;background:var(--plan-error);color:#fff;font:700 13px/20px var(--font-body);text-align:center">✕</span></div><div class="cap">Площади не сходятся</div><div class="mut">Экспликация 109,4 м² ≠ лист ЭП 114,4 м²</div></div>
<div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="position:relative;height:120px;border-radius:6px;border:1px solid var(--border-default);background:url(../../assets/images/site-plan-f1.png) -1040px -1130px/2262px no-repeat #fff"><span style="position:absolute;top:6px;left:6px;width:20px;height:20px;border-radius:50%;background:var(--plan-error);color:#fff;font:700 13px/20px var(--font-body);text-align:center">✕</span></div><div class="cap">«Помещение» вместо названия</div><div class="mut">Назовите: прихожая, санузел, холл</div></div>
</div></body></html>
