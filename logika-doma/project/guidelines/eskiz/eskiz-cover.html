<!-- @dsCard group="Эскизный проект" viewport="700x400" name="Титульный лист" subtitle="Логотип, название, рендер, ключевые цифры" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:20px;box-sizing:border-box;font:var(--text-secondary-font);font-variant-numeric:tabular-nums}.cap{font:500 12px/1.3 var(--font-body)}.mut{font:12px/1.35 var(--font-body);color:var(--text-muted)}.h{font:700 15px var(--font-display);color:var(--text-heading)}.ok{color:var(--plan-ok);font-weight:600}.no{color:var(--plan-error);font-weight:600}
.node{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--ld-navy);color:#fff;font:600 10px/18px var(--font-display);text-align:center;flex:none}
.ex{background:#fff;border:1px solid var(--border-default);border-radius:8px;box-shadow:var(--shadow-card);padding:12px 14px 10px;font:13px/1.3 var(--font-body)}.ex .r{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:3px 0;border-bottom:1px solid var(--grid-line)}.ex .r .node{width:18px;height:18px;background:var(--ld-navy-50);color:var(--ld-navy)}.ex .r .node.w{background:var(--ld-blue-50)}.ex .g{font:600 10px var(--font-body);letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);margin:6px 0 2px}.ex .t{display:flex;justify-content:space-between;margin-top:6px;font:600 13px var(--font-display);color:var(--text-heading)}
.tb{display:grid;grid-template-columns:48px minmax(0,1fr) 70px;box-sizing:border-box;grid-template-rows:1fr 1fr;border:1.5px solid var(--sheet-frame);background:#fff}.tb>div{display:flex;align-items:center;padding:0 8px}.tb .lg{grid-column:1;grid-row:1 / 3;justify-content:center}.tb .p{grid-column:3;grid-row:1 / 3;align-items:center;border-left:1.5px solid var(--sheet-frame);flex-direction:column;justify-content:center}.tb .a{grid-column:2;grid-row:1;white-space:nowrap;overflow:hidden;min-width:0;border-left:1.5px solid var(--sheet-frame);border-bottom:1px solid var(--sheet-frame);font:700 10px var(--font-display);color:var(--ld-navy)}.tb .b{grid-column:2;grid-row:2;white-space:nowrap;overflow:hidden;min-width:0;border-left:1.5px solid var(--sheet-frame);font:500 9px var(--font-body)}
</style></head><body><div style="position:relative;width:520px;height:368px;margin:0 auto;background:#fff;box-shadow:var(--shadow-card)">
<div style="position:absolute;left:25px;top:7px;right:7px;bottom:7px;border:1.5px solid var(--sheet-frame);padding:18px 20px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px">
<div style="display:flex;flex-direction:column;align-items:flex-start;gap:8px"><img src="../../assets/logo-horizontal.svg" alt="Логика Дома" style="height:40px"><div style="font:400 11px/1.35 var(--font-body);color:var(--text-secondary)">Эскизный проект двухэтажного жилого дома из газобетонных блоков</div></div>
<div style="flex:1;border-radius:4px;background:url(../../assets/images/eskiz-view-01.png) center/cover no-repeat"></div>
<div style="display:flex;gap:18px;align-items:flex-end"><div><div style="font:700 14px var(--font-display);color:var(--text-heading);white-space:nowrap">228,7 м²</div><div class="mut" style="font-size:9px">S общая</div></div><div><div style="font:700 14px var(--font-display);color:var(--text-heading);white-space:nowrap">147,2 м²</div><div class="mut" style="font-size:9px">S застройки</div></div><div><div style="font:700 14px var(--font-display);color:var(--text-heading);white-space:nowrap">12,22 × 13,32 м</div><div class="mut" style="font-size:9px">Габариты</div></div></div>
<div class="tb" style="position:absolute;right:-1.5px;bottom:-1.5px;width:250px;height:30px"><div class="lg"><img src="../../assets/mark.png" style="height:20px"></div><div class="a" style="font-size:7.5px">Логика Дома · Эскизный проект</div><div class="p"><span style="font:600 9px var(--font-display)">1 / 12</span></div><div class="b" style="font-size:8px">Титульный лист</div></div>
</div></div></body></html>
