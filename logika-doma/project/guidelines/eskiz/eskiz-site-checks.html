<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:20px;box-sizing:border-box;font:var(--text-secondary-font);font-variant-numeric:tabular-nums}.cap{font:500 12px/1.3 var(--font-body)}.mut{font:12px/1.35 var(--font-body);color:var(--text-muted)}.h{font:700 15px var(--font-display);color:var(--text-heading)}.ok{color:var(--plan-ok);font-weight:600}.no{color:var(--plan-error);font-weight:600}
.node{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--ld-navy);color:#fff;font:600 10px/18px var(--font-display);text-align:center;flex:none}
.ex{background:#fff;border:1px solid var(--border-default);border-radius:8px;box-shadow:var(--shadow-card);padding:12px 14px 10px;font:13px/1.3 var(--font-body)}.ex .r{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:3px 0;border-bottom:1px solid var(--grid-line)}.ex .r .node{width:18px;height:18px;background:var(--ld-navy-50);color:var(--ld-navy)}.ex .r .node.w{background:var(--ld-blue-50)}.ex .g{font:600 10px var(--font-body);letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);margin:6px 0 2px}.ex .t{display:flex;justify-content:space-between;margin-top:6px;font:600 13px var(--font-display);color:var(--text-heading)}
.tb{display:grid;grid-template-columns:48px 1fr 70px;grid-template-rows:1fr 1fr;border:1.5px solid var(--sheet-frame);background:#fff}.tb>div{display:flex;align-items:center;padding:0 8px}.tb .lg{grid-row:1/3;justify-content:center}.tb .p{grid-row:1/3;border-left:1.5px solid var(--sheet-frame);flex-direction:column;justify-content:center}.tb .a{border-left:1.5px solid var(--sheet-frame);border-bottom:1px solid var(--sheet-frame);font:700 10px var(--font-display);color:var(--ld-navy)}.tb .b{border-left:1.5px solid var(--sheet-frame);font:500 9px var(--font-body)}
</style></head><body><div style="display:grid;grid-template-columns:1fr 1.2fr;gap:28px;align-items:start">
<div style="position:relative;height:180px;background:#E6EEDF;border:1px solid #c8d4bf;border-bottom:2px solid var(--plan-error)">
<div style="position:absolute;left:30%;top:30%;width:42%;height:48%;background:#B8BDC9;background-image:repeating-linear-gradient(45deg,#9aa0ae 0 1px,transparent 1px 6px);display:flex;align-items:center;justify-content:center;font:600 10px var(--font-display)">Дом</div>
<div style="position:absolute;left:8%;top:8%;width:22%;height:20%;background:#C9A57D;font:9px var(--font-body);display:flex;align-items:center;justify-content:center">Баня</div>
<div style="position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;border:1px solid var(--plan-line);display:flex;align-items:center;justify-content:center;font:700 9px var(--font-display);color:var(--ld-navy);background:#fff">С↑</div>
<span style="position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font:600 9px var(--font-body);letter-spacing:.06em;color:var(--plan-error)">УЛИЦА</span></div>
<div style="display:flex;flex-direction:column;gap:6px;font:12.5px/1.35 var(--font-body)"><div class="h" style="margin-bottom:2px">Отступы по нормам</div>
<div><span class="ok">✓</span> Дом: 6,0 м до улицы, 6,39 м до соседей</div><div><span class="ok">✓</span> Баня: 1 м до забора, 8 м до дома</div><div style="color:var(--plan-error)"><span class="no">✕</span> Игровая зона: 1,0 м до забора (нужно 2,0)</div>
<div class="mut" style="margin-top:4px">Нарушения — первыми, Coral. Одинаковые объекты группируйте: «Клумбы (7) — в норме».</div></div></div></body></html>
