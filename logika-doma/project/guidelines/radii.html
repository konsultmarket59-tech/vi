<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;box-sizing:border-box;font:var(--text-secondary-font)}.cap{font:500 12px/1.3 var(--font-body);color:var(--text-primary)}.hex{font:12px/1.3 var(--font-body);color:var(--text-muted)}</style></head><body><div style="display:flex;gap:16px"><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:64px;background:var(--surface-soft);border:1px solid var(--border-strong);border-radius:var(--radius-xs)"></div><div class="cap">xs · 4px</div></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:64px;background:var(--surface-soft);border:1px solid var(--border-strong);border-radius:var(--radius-sm)"></div><div class="cap">sm · 6px</div></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:64px;background:var(--surface-soft);border:1px solid var(--border-strong);border-radius:var(--radius-md)"></div><div class="cap">md · 8px</div></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:64px;background:var(--surface-soft);border:1px solid var(--border-strong);border-radius:var(--radius-lg)"></div><div class="cap">lg · 12px</div></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:64px;background:var(--surface-soft);border:1px solid var(--border-strong);border-radius:var(--radius-xl)"></div><div class="cap">xl · 16px</div></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:64px;background:var(--surface-soft);border:1px solid var(--border-strong);border-radius:var(--radius-pill)"></div><div class="cap">pill · 999px</div></div></div></body></html>
