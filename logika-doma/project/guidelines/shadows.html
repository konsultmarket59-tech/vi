<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;box-sizing:border-box;font:var(--text-secondary-font)}.cap{font:500 12px/1.3 var(--font-body);color:var(--text-primary)}.hex{font:12px/1.3 var(--font-body);color:var(--text-muted)}</style></head><body><div style="display:flex;gap:20px;background:var(--surface-soft);padding:20px;margin:-20px;height:160px;box-sizing:border-box"><div style="flex:1;background:#fff;border-radius:12px;box-shadow:var(--shadow-xs);display:flex;align-items:center;justify-content:center" class="cap">--shadow-xs</div><div style="flex:1;background:#fff;border-radius:12px;box-shadow:var(--shadow-card);display:flex;align-items:center;justify-content:center" class="cap">--shadow-card</div><div style="flex:1;background:#fff;border-radius:12px;box-shadow:var(--shadow-hover);display:flex;align-items:center;justify-content:center" class="cap">--shadow-hover</div><div style="flex:1;background:#fff;border-radius:12px;box-shadow:var(--shadow-pop);display:flex;align-items:center;justify-content:center" class="cap">--shadow-pop</div></div></body></html>
