<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;box-sizing:border-box;font:var(--text-secondary-font)}.cap{font:500 12px/1.3 var(--font-body);color:var(--text-primary)}.hex{font:12px/1.3 var(--font-body);color:var(--text-muted)}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px 24px"><div style="display:flex;align-items:center;gap:10px"><span style="width:14px;height:14px;border-radius:50%;background:var(--ld-navy);flex:none"></span><span class="cap" style="width:150px">Navy</span><span class="hex">бренд, главные действия</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:14px;height:14px;border-radius:50%;background:var(--ld-orange);flex:none"></span><span class="cap" style="width:150px">Orange</span><span class="hex">вторичные акценты, данные</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:14px;height:14px;border-radius:50%;background:var(--ld-cyan);flex:none"></span><span class="cap" style="width:150px">Cyan</span><span class="hex">интерактив и связи</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:14px;height:14px;border-radius:50%;background:var(--ld-coral);flex:none"></span><span class="cap" style="width:150px">Coral</span><span class="hex">уведомления, спец. маркеры</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:14px;height:14px;border-radius:50%;background:var(--ld-blue);flex:none"></span><span class="cap" style="width:150px">Blue</span><span class="hex">активные состояния, ссылки</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:14px;height:14px;border-radius:50%;background:var(--ld-cool-gray);flex:none"></span><span class="cap" style="width:150px">Cool Gray</span><span class="hex">неактивное, нейтральное</span></div></div></body></html>
