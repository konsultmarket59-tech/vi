<!-- @dsCard group="Colors" viewport="700x130" name="Project status" subtitle="Статусы проекта" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;box-sizing:border-box;font:var(--text-secondary-font)}.cap{font:500 12px/1.3 var(--font-body);color:var(--text-primary)}.hex{font:12px/1.3 var(--font-body);color:var(--text-muted)}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px"><div style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;border-radius:50%;background:var(--status-draft)"></span><span class="cap" style="font-weight:400">Черновик</span><span class="hex">--status-draft</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;border-radius:50%;background:var(--status-review)"></span><span class="cap" style="font-weight:400">На согласовании</span><span class="hex">--status-review</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;border-radius:50%;background:var(--status-progress)"></span><span class="cap" style="font-weight:400">В работе</span><span class="hex">--status-progress</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;border-radius:50%;background:var(--status-done)"></span><span class="cap" style="font-weight:400">Завершён</span><span class="hex">--status-done</span></div></div></body></html>
