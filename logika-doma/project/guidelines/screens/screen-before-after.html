<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:20px;box-sizing:border-box;font:var(--text-secondary-font);font-variant-numeric:tabular-nums}.cap{font:500 12px/1.3 var(--font-body)}.mut{font:12px/1.35 var(--font-body);color:var(--text-muted)}.h{font:700 15px var(--font-display);color:var(--text-heading)}.ok{color:var(--plan-ok);font-weight:600}.no{color:var(--plan-error);font-weight:600}
.node{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--ld-navy);color:#fff;font:600 10px/18px var(--font-display);text-align:center;flex:none}
.ex{background:#fff;border:1px solid var(--border-default);border-radius:8px;box-shadow:var(--shadow-card);padding:12px 14px 10px;font:13px/1.3 var(--font-body)}.ex .r{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:3px 0;border-bottom:1px solid var(--grid-line)}.ex .r .node{width:18px;height:18px;background:var(--ld-navy-50);color:var(--ld-navy)}.ex .r .node.w{background:var(--ld-blue-50)}.ex .g{font:600 10px var(--font-body);letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);margin:6px 0 2px}.ex .t{display:flex;justify-content:space-between;margin-top:6px;font:600 13px var(--font-display);color:var(--text-heading)}
.tb{display:grid;grid-template-columns:48px 1fr 70px;grid-template-rows:1fr 1fr;border:1.5px solid var(--sheet-frame);background:#fff}.tb>div{display:flex;align-items:center;padding:0 8px}.tb .lg{grid-row:1/3;justify-content:center}.tb .p{grid-row:1/3;border-left:1.5px solid var(--sheet-frame);flex-direction:column;justify-content:center}.tb .a{border-left:1.5px solid var(--sheet-frame);border-bottom:1px solid var(--sheet-frame);font:700 10px var(--font-display);color:var(--ld-navy)}.tb .b{border-left:1.5px solid var(--sheet-frame);font:500 9px var(--font-body)}
</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
<div style="display:flex;flex-direction:column;gap:6px"><div style="height:180px;border-radius:6px;border:1px solid var(--border-default);background:url(../../assets/images/site-render-ext.png) 0 0/100% 100%"></div><div class="cap"><span class="no">✕</span> Сейчас</div><div class="mut">Дом мелкий, 50% газона, экспликация перекрывает забор, нет бренда</div></div>
<div style="display:flex;flex-direction:column;gap:6px"><div style="position:relative;height:180px;border-radius:6px;overflow:hidden;background:url(../../assets/images/site-render-crop.png) center/cover no-repeat"><div class="ex" style="position:absolute;right:8px;top:8px;width:112px;padding:5px 6px;font-size:6px;line-height:1.2;white-space:nowrap"><div style="font:700 6.5px var(--font-display);color:var(--text-heading);margin-bottom:2px">Экспликация</div><div style="display:flex;justify-content:space-between;gap:6px;white-space:nowrap;border-bottom:1px solid var(--grid-line);padding:1px 0"><span>Кабинет</span><span>11,7</span></div><div style="display:flex;justify-content:space-between;gap:6px;white-space:nowrap;border-bottom:1px solid var(--grid-line);padding:1px 0"><span>Спальня</span><span>14,9</span></div><div style="display:flex;justify-content:space-between;gap:6px;white-space:nowrap;border-bottom:1px solid var(--grid-line);padding:1px 0"><span>Кухня-гостиная</span><span>48,3</span></div><div style="display:flex;justify-content:space-between;gap:6px;white-space:nowrap;border-bottom:1px solid var(--grid-line);padding:1px 0"><span>Спальня</span><span>26,9</span></div><div style="display:flex;justify-content:space-between;gap:6px;white-space:nowrap;border-bottom:1px solid var(--grid-line);padding:1px 0"><span>Спальня</span><span>33,0</span></div><div style="display:flex;justify-content:space-between;gap:6px;white-space:nowrap;font:600 6px var(--font-display);color:var(--text-heading);margin-top:2px"><span>Всего</span><span>228,7 м²</span></div></div><div style="position:absolute;left:8px;bottom:8px;background:rgba(255,255,255,.92);border-radius:4px;padding:3px 6px"><img src="../../assets/logo-horizontal.svg" style="height:12px;display:block"></div></div><div class="cap"><span class="ok">✓</span> По правилам</div><div class="mut">Дом крупно, экспликация-карточка в своей колонке, логотип и подпись</div></div></div></body></html>
