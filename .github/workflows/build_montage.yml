name: Build Montage desktop app

on:
  workflow_dispatch: {}
  push:
    tags:
      - "montage-build-*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: personal-chat
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build
      # Отдельная программа «Монтаж»: тот же код, своя конфигурация сборки
      # (имя, иконка папки, точка входа electron/montage-main.cjs).
      - run: npx electron-builder --win --config electron-builder.montage.json --publish never

      - name: Publish build to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: montage-desktop
          name: "Монтаж — сборка для Windows"
          body: |
            Автоматическая сборка видеоредактора «Монтаж» из ветки ${{ github.ref_name }}.
            Скачайте `.exe` ниже и запустите (portable-версия не требует установки,
            Setup-версия — обычный установщик).
          prerelease: true
          files: |
            personal-chat/release-montage/*.exe
