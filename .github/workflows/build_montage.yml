name: Build Montage desktop app

on:
  workflow_dispatch: {}
  push:
    tags:
      - "montage-build-*"
    # Ветка, в которой делается «Монтаж»: каждая отправка с правками программы
    # сразу собирает установщик — запускать сборку руками не нужно.
    branches:
      - "claude/exciting-gauss-8w8aki"
    paths:
      - "personal-chat/**"
      - ".github/workflows/build_montage.yml"

permissions:
  contents: write

jobs:
  # Только Windows: программа нужна там. Имена файлов — латиницей: кириллицу
  # GitHub вырезает из имён файлов релиза.
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: personal-chat
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build
      # Отдельная программа «Монтаж»: тот же код, своя конфигурация сборки
      # (имя, точка входа electron/montage-main.cjs, папка release-montage).
      # --publish never: иначе electron-builder пробует выложить сборку сам.
      - run: npx electron-builder --win --config electron-builder.montage.json --publish never

      # Файлы сборки — прямо на странице запуска, без релиза.
      - uses: actions/upload-artifact@v4
        with:
          name: Montage-Windows
          path: personal-chat/release-montage/*.exe
          if-no-files-found: error

      - name: Publish build to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: montage-desktop
          name: "Монтаж — видеоредактор для Windows"
          body: |
            Автоматическая сборка видеоредактора «Монтаж» для Windows из ветки ${{ github.ref_name }}.
            `Montage-…-portable.exe` — запускается без установки, `Montage-…-Setup.exe` — обычный установщик.
            При первом запуске SmartScreen может предупредить («файл без цифровой подписи») —
            «Подробнее» → «Выполнить в любом случае».
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: personal-chat/release-montage/*.exe
