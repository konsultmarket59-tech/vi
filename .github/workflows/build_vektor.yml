name: Build Vektor desktop app

on:
  workflow_dispatch: {}
  push:
    tags:
      - "vektor-build-*"
    # рабочая ветка: каждое изменение программы сразу собирается в .exe
    branches:
      - "claude/wonderful-curie-doojvs"
    paths:
      - "vektor/**"
      - ".github/workflows/build_vektor.yml"

permissions:
  contents: write

jobs:
  # Рабочее пространство «Фигма» — открытый редактор OpenPencil (MIT), собирается из исходников
  build-figma:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vektor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: node tools/figma/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: figma
          path: vektor/figma

  build-windows:
    needs: build-figma
    runs-on: windows-latest
    defaults:
      run:
        working-directory: vektor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: figma
          path: vektor/figma

      - run: npm ci

      # --publish never: иначе electron-builder сам пробует выложить сборку и требует GH_TOKEN
      - run: npx electron-builder --win --publish never

      - name: Publish build to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vektor-desktop
          target_commitish: ${{ github.sha }}
          name: "Вектор — сборка для Windows"
          body: |
            Автоматическая сборка «Вектора» из ${{ github.ref_name }} (коммит ${{ github.sha }}).
            Скачайте `.exe` ниже: portable-версия запускается без установки,
            Setup-версия — обычный установщик (ассоциирует файлы .vkt, .fig, .vkm).
          prerelease: true
          files: |
            vektor/release/*.exe
