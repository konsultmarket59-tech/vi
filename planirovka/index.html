<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Перепланировка 11,2 × 8,2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Mono&family=PT+Sans+Narrow:wght@400;700&family=PT+Sans:wght@400;700&display=swap">
<style>
/* Layout: чертёжный стол — слева инструменты и каталог, в центре лист с планом/3D, справа штамп: свойства, палитра, проверка */
:root{
  --paper:#eef0ec; --sheet:#fafbf8; --panel:#ffffff; --ink:#21262b; --muted:#68707a; --line:#d5dad3;
  --grid:#e6e9e3; --grid2:#d3d8d0; --wall:#3c4248; --hatch:#c9cec7; --furn:#ffffff;
  --accent:#1d5fae; --accent-soft:#e2ebf7; --wet:#2a8db0; --wet-soft:rgba(42,141,176,.08);
  --ok:#2c7a4b; --bad:#b4372b; --warn:#a2650f; --shadow:0 1px 2px rgba(20,30,40,.08),0 4px 14px rgba(20,30,40,.06);
  --f-ui:"PT Sans","Segoe UI",Arial,sans-serif; --f-draw:"PT Sans Narrow","Arial Narrow",Arial,sans-serif; --f-num:"PT Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#121518; --sheet:#171b1f; --panel:#1b2025; --ink:#e4e7e4; --muted:#98a0a8; --line:#2c3339;
  --grid:#1f252a; --grid2:#2a3137; --wall:#b5bcc3; --hatch:#59616a; --furn:#20262c;
  --accent:#7aa8ec; --accent-soft:#1d2a3b; --wet:#5bb6d6; --wet-soft:rgba(91,182,214,.08);
  --ok:#5cbf86; --bad:#ef7b6f; --warn:#e2a94a; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#121518; --sheet:#171b1f; --panel:#1b2025; --ink:#e4e7e4; --muted:#98a0a8; --line:#2c3339;
  --grid:#1f252a; --grid2:#2a3137; --wall:#b5bcc3; --hatch:#59616a; --furn:#20262c;
  --accent:#7aa8ec; --accent-soft:#1d2a3b; --wet:#5bb6d6; --wet-soft:rgba(91,182,214,.08);
  --ok:#5cbf86; --bad:#ef7b6f; --warn:#e2a94a; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.4 var(--f-ui)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr;padding-inline:0}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.stamp{display:grid;grid-template-columns:auto auto;border:1.5px solid var(--ink);font-family:var(--f-draw);line-height:1.15}
.stamp b{grid-row:span 2;padding:4px 10px;font-size:19px;letter-spacing:.02em;border-right:1.5px solid var(--ink);display:flex;align-items:center}
.stamp span{padding:1px 8px;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.stamp span+span{border-top:1px solid var(--ink)}
.tabs{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tabs button{border:0;background:transparent;padding:6px 16px;font-family:var(--f-draw);font-size:15px;letter-spacing:.04em}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.spacer{flex:1}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 10px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn.danger{color:var(--bad)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn svg{width:16px;height:16px}

.work{display:grid;grid-template-columns:248px minmax(0,1fr) 300px;min-height:0}
.side{overflow:auto;background:var(--panel);min-height:0}
.side.left{border-right:1px solid var(--line)}
.side.right{border-left:1px solid var(--line)}
.sec{padding:14px 16px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.sec h2{margin:0;font:700 12px/1 var(--f-draw);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tool{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 8px;text-align:left;font-size:13px}
.tool svg{width:18px;height:18px;flex:none}
.tool kbd{margin-left:auto;font:11px var(--f-num);color:var(--muted)}
.tool[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:13px}
.opts label{display:grid;gap:3px;color:var(--muted);font-size:12px}
.opts .chk{display:flex;gap:6px;align-items:center;grid-column:span 2;color:var(--ink);font-size:13px}
select,input[type=number],input[type=text]{border:1px solid var(--line);border-radius:5px;background:var(--sheet);padding:4px 6px;width:100%;min-width:0}
.cat-group{display:grid;gap:6px}
.cat-group h3{margin:4px 0 0;font:700 13px var(--f-draw);letter-spacing:.04em}
.cat-group h3 small{font-weight:400;color:var(--wet);letter-spacing:0}
.cat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.item{border:1px solid var(--line);border-radius:6px;background:var(--sheet);padding:4px 2px 5px;display:grid;justify-items:center;gap:2px;font-size:11px;line-height:1.15;text-align:center;cursor:grab;user-select:none}
.item:hover{border-color:var(--accent)}
.item canvas{width:46px;height:40px}

.board{position:relative;min-width:0;min-height:0;background:var(--sheet);overflow:hidden}
#stage,#three{position:absolute;inset:0}
#stage{touch-action:none}
.hud{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:8px;align-items:flex-end;pointer-events:none;flex-wrap:wrap}
.hud>*{pointer-events:auto}
.zoom{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;background:var(--panel);overflow:hidden;box-shadow:var(--shadow)}
.zoom button{border:0;background:transparent;width:34px;height:32px;font-size:17px}
.zoom button+button{border-top:1px solid var(--line)}
.hint{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;color:var(--muted);box-shadow:var(--shadow);max-width:560px}
.hint b{color:var(--ink);font-weight:700}
.coords{margin-left:auto;font:12px var(--f-num);color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.view3d{position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap}
.toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:6px;font-size:13px;box-shadow:var(--shadow);max-width:min(520px,90%);text-align:center;z-index:5}
.loading3d{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}

.props{display:grid;gap:10px}
.props h3{margin:0;font:700 17px var(--f-draw)}
.props .sub{font-size:12px;color:var(--muted);margin-top:-6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 label,.props label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.lock{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--warn)}
input[type=color]{width:100%;height:30px;border:1px solid var(--line);border-radius:5px;background:var(--sheet);padding:2px}
.swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.sw{aspect-ratio:1;border-radius:50%;border:1px solid rgba(0,0,0,.18);padding:0}
.sw[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.score{display:flex;align-items:center;gap:10px}
.score .bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.score .bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.score b{font:700 15px var(--f-num)}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.checks li{display:grid;grid-template-columns:18px 1fr;gap:6px;font-size:13px;line-height:1.3}
.checks .ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font:700 11px var(--f-num);color:var(--panel)}
.checks .ok .ic{background:var(--ok)}
.checks .bad .ic{background:var(--bad)}
.checks small{display:block;color:var(--muted);font-size:12px}
.win{font-size:13px;color:var(--ok);font-weight:700}
table.rooms{width:100%;border-collapse:collapse;font-size:13px}
table.rooms td{padding:4px 2px;border-bottom:1px solid var(--line)}
table.rooms td:first-child{font:12px var(--f-num);color:var(--muted);width:22px}
table.rooms td:last-child{text-align:right;font-family:var(--f-num);white-space:nowrap}
table.rooms tr{cursor:pointer}
table.rooms tr:hover td{background:var(--accent-soft)}
table.rooms tfoot td{font-weight:700;border-bottom:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;border:1px solid rgba(0,0,0,.2);vertical-align:-1px}
.muted{color:var(--muted);font-size:12px}
.hidden-file{display:none}

@media (max-width:980px){
  .app{height:auto}
  .work{grid-template-columns:1fr}
  .board{height:68vh;order:-1}
  .side.left,.side.right{border:0;overflow:visible}
  .cat{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}
  .tools{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="stamp" aria-label="Проект"><b>План этажа</b><span>Дом 11 200 × 8 200</span><span>Лист 1 · М 1:100</span></div>
    <div class="tabs" role="group" aria-label="Вид">
      <button id="tab2d" aria-pressed="true">План 2D</button>
      <button id="tab3d" aria-pressed="false">3D вид</button>
    </div>
    <div class="spacer"></div>
    <div class="acts">
      <button class="btn" id="undo" title="Отменить (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>Отменить</button>
      <button class="btn" id="redo" title="Вернуть (Ctrl+Shift+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg>Вернуть</button>
      <button class="btn" id="reset">Исходный план</button>
      <button class="btn danger" id="clear">Пустой дом</button>
      <button class="btn" id="save">Сохранить файл</button>
      <button class="btn" id="open">Открыть файл</button>
      <input type="file" id="file" class="hidden-file" accept=".json,application/json">
    </div>
  </header>

  <main class="work">
    <aside class="side left">
      <section class="sec">
        <h2>Инструменты</h2>
        <div class="tools" id="tools">
          <button class="tool" data-tool="select" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 3 14 8-6 2-3 6z"/></svg>Выбор<kbd>V</kbd></button>
          <button class="tool" data-tool="wall"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="10" width="18" height="4" fill="currentColor"/></svg>Стена<kbd>W</kbd></button>
          <button class="tool" data-tool="door"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 20V6"/><path d="M5 6a14 14 0 0 1 14 14"/><path d="M3 20h18"/></svg>Дверь<kbd>D</kbd></button>
          <button class="tool" data-tool="zone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3"><path d="M3 12h18"/></svg>Граница зоны<kbd>Z</kbd></button>
          <button class="tool" data-tool="paint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15c0-2 2-3 3-3l8-8 4 4-8 8c0 1-1 3-3 3H4z"/></svg>Покраска<kbd>P</kbd></button>
        </div>
        <div class="opts">
          <label>Толщина стены<select id="optT"><option value="80">80 мм</option><option value="100">100 мм</option><option value="120" selected>120 мм</option><option value="150">150 мм</option></select></label>
          <label>Ширина двери<select id="optDW"><option>600</option><option>700</option><option selected>800</option><option>900</option></select></label>
          <label>Привязка<select id="optG"><option value="10">10 мм</option><option value="50" selected>50 мм</option><option value="100">100 мм</option></select></label>
          <label class="chk" style="grid-column:auto"><input type="checkbox" id="optO" checked>Углы 90°</label>
        </div>
      </section>
      <section class="sec">
        <h2>Мебель и сантехника</h2>
        <div class="muted">Нажмите на предмет или перетащите его на план.</div>
        <div id="catalog" class="cat-wrap" style="display:grid;gap:10px"></div>
      </section>
    </aside>

    <section class="board" id="board">
      <div id="stage"></div>
      <div id="three" hidden></div>
      <div class="view3d" id="view3d" hidden>
        <button class="btn" id="v3iso">Изометрия</button>
        <button class="btn" id="v3top">Сверху</button>
        <button class="btn" id="v3eye">Взгляд из гостиной</button>
        <button class="btn" id="v3cut" aria-pressed="false">Срезать стены</button>
      </div>
      <div class="hud">
        <div class="zoom" id="zoomCtl"><button id="zin" title="Приблизить">+</button><button id="zout" title="Отдалить">−</button><button id="zfit" title="Вписать">⤢</button></div>
        <div class="hint" id="hint"></div>
        <div class="coords" id="coords">—</div>
      </div>
      <div class="toast" id="toast" hidden></div>
    </section>

    <aside class="side right">
      <section class="sec"><h2>Свойства</h2><div class="props" id="props"></div></section>
      <section class="sec">
        <h2>Палитра стен <select id="preset" style="width:auto;font-size:12px"></select></h2>
        <div class="swatches" id="swatches"></div>
        <div class="grid2"><label>Цвет выбранной ячейки<input type="color" id="swEdit"></label>
        <div class="muted" style="align-self:end">Инструмент «Покраска»: щёлкните по комнате на плане или в 3D.</div></div>
      </section>
      <section class="sec"><h2>Проверка проекта</h2><div class="score"><div class="bar"><i id="scoreBar"></i></div><b id="scoreTxt">0/0</b></div><ul class="checks" id="checks"></ul></section>
      <section class="sec"><h2>Помещения</h2><table class="rooms" id="rooms"></table></section>
    </aside>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/konva@9.3.14/konva.min.js"></script>

/* Двери держатся в пределах своих стен, лишние удаляются */
function normalize() {
  S.doors = S.doors.filter((d) => {
    const w = S.walls.find((x) => x.id === d.wall);
    if (!w || w.kind !== 'wall') return false;
    const L = wdir(w).L;

    d.pos = clamp(d.pos, d.w / 2 + 60, L - d.w / 2 - 60);
    return true;

/* двери остаются на месте, когда стена меняет длину или сдвигается */
function keepDoors(before) {
  for (const d of S.doors) {
    const ow = before[d.wall], nw = S.walls.find((w) => w.id === d.wall); if (!ow || !nw) continue;
    const p = wpt(ow, d.pos), pr = segProj(p.x, p.y, nw.x1, nw.y1, nw.x2, nw.y2); d.pos = Math.round(pr.t * wdir(nw).L);

/* ---------- проверки размещения ---------- */
function wallError(w) {
  const d = wdir(w);
  if (d.L < 150) return 'Слишком короткая стена';
  const r = Math.max(0, w.t / 2 - 2);
  const B = { x1: BOILER.x1 - r, y1: BOILER.y1 - r, x2: BOILER.x2 + r, y2: BOILER.y2 + r };
  const Sh = { x1: SHAFT.x1 - r, y1: SHAFT.y1 - r, x2: SHAFT.x2 + r, y2: SHAFT.y2 + r };
  for (let s = 0; s <= d.L; s += 20) {
    const p = { x: w.x1 + d.ux * s, y: w.y1 + d.uy * s };
    const inner = (R) => p.x > R.x1 && p.x < R.x2 && p.y > R.y1 && p.y < R.y2;
    if (inner(B)) return 'Котельная неизменна — внутри неё перегородки ставить нельзя';
    if (inner(Sh)) return 'Здесь проходит шахта стояков — её нельзя перекрывать';
  }

}
function furnError(f) {
  const P = obb(f);
  if (polyOverlap(P, rectPoly(BOILER_OUT))) return 'Котельная неизменна — туда мебель не ставится';
  if (polyOverlap(P, rectPoly(SHAFT))) return 'Здесь шахта стояков';
  if (!P.every((p) => inRect(p, { x1: 0, y1: 0, x2: W, y2: H }, 5))) return 'Предмет выходит за наружную стену';
  if (CAT[f.type].wet && !P.every((p) => inRect(p, WET, 5))) return 'Сантехника ставится только в зоне выводов у стояков (голубая штриховка)';
  return null;
}

/* ---------- анализ: помещения, площади, правила ---------- */
function analyze() {
  const g = new Uint8Array(NX * NY); // 0 пол, 1 стена, 2 граница зоны
  const mark = (w, val, r) => {
    const i0 = Math.max(0, Math.floor((Math.min(w.x1, w.x2) - r) / CELL)), i1 = Math.min(NX - 1, Math.floor((Math.max(w.x1, w.x2) + r) / CELL));
    const j0 = Math.max(0, Math.floor((Math.min(w.y1, w.y2) - r) / CELL)), j1 = Math.min(NY - 1, Math.floor((Math.max(w.y1, w.y2) + r) / CELL));
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      const k = j * NX + i; if (g[k] === 1) continue;
      if (segProj((i + .5) * CELL, (j + .5) * CELL, w.x1, w.y1, w.x2, w.y2).d <= r) g[k] = val;
    }
  };
  for (const w of allWalls()) w.kind === 'zone' ? mark(w, 2, 30) : mark(w, 1, w.t / 2);
  for (let j = Math.round(SHAFT.y1 / CELL); j < Math.round(SHAFT.y2 / CELL); j++) for (let i = Math.round(SHAFT.x1 / CELL); i < Math.round(SHAFT.x2 / CELL); i++) g[j * NX + i] = 1;

  const lab = new Int32Array(NX * NY); let rooms = [];
  const q = new Int32Array(NX * NY);
  for (let k0 = 0; k0 < NX * NY; k0++) {
    if (g[k0] !== 0 || lab[k0]) continue;
    const id = rooms.length + 1; const r = { id, n: 0, sx: 0, sy: 0, cells: [] };
    let h = 0, t = 0; q[t++] = k0; lab[k0] = id;
    while (h < t) {
      const k = q[h++], i = k % NX, j = (k - i) / NX; r.n++; r.sx += i; r.sy += j; r.cells.push(k);
      if (i > 0 && !g[k - 1] && !lab[k - 1]) { lab[k - 1] = id; q[t++] = k - 1; }
      if (i < NX - 1 && !g[k + 1] && !lab[k + 1]) { lab[k + 1] = id; q[t++] = k + 1; }
      if (j > 0 && !g[k - NX] && !lab[k - NX]) { lab[k - NX] = id; q[t++] = k - NX; }
      if (j < NY - 1 && !g[k + NX] && !lab[k + NX]) { lab[k + NX] = id; q[t++] = k + NX; }
    }
    rooms.push(r);
  }
  // клетки границы зоны отдаём соседнему помещению
  for (let pass = 0; pass < 3; pass++) for (let k = 0; k < NX * NY; k++) {
    if (g[k] !== 2 || lab[k]) continue;
    const i = k % NX; const nb = [i > 0 ? k - 1 : -1, i < NX - 1 ? k + 1 : -1, k - NX, k + NX];
    for (const m of nb) if (m >= 0 && m < NX * NY && lab[m] > 0 && g[m] !== 1) { lab[k] = lab[m]; const r = rooms[lab[m] - 1]; r.n++; r.sx += i; r.sy += (k - i) / NX; r.cells.push(k); break; }
  }
  // мелкие щели — не помещения
  for (const r of rooms) if (r.n * CELL * CELL < 250000) { for (const k of r.cells) lab[k] = 0; r.dead = true; }
  const alive = rooms.filter((r) => !r.dead);
  const remap = new Int32Array(rooms.length + 1);
  alive.forEach((r, i) => { remap[r.id] = i + 1; r.id = i + 1; });
  for (let k = 0; k < lab.length; k++) lab[k] = remap[lab[k]] || 0;
  rooms = alive;
  const byId = rooms.slice();
  const roomAt = (x, y) => {
    const i = Math.floor(x / CELL), j = Math.floor(y / CELL);
    if (i < 0 || j < 0 || i >= NX || j >= NY) return null;
    const v = lab[j * NX + i]; return v ? byId[v - 1] : null;
  };
  for (const r of rooms) {
    r.area = r.n * CELL * CELL / 1e6;
    const cx = r.sx / r.n, cy = r.sy / r.n; let best = r.cells[0], bd = Infinity;
    for (const k of r.cells) { const i = k % NX, j = (k - i) / NX; if (g[k]) continue; const dd = (i - cx) ** 2 + (j - cy) ** 2; if (dd < bd) { bd = dd; best = k; } }

  for (const f of allFurn()) { const r = roomAt(f.x, f.y); if (r) { r.types.add(f.type); r.furn.push(f); } }
  const br = roomAt((BOILER.x1 + BOILER.x2) / 2, (BOILER.y1 + BOILER.y2) / 2); if (br) br.boiler = true;
  // связи через двери и границы зон
  const link = (a, b, kind) => { if (!a || !b || a === b) return; a.links.add(b); b.links.add(a); if (kind === 'door') { a.doors++; b.doors++; } else { a.open++; b.open++; } };
  for (const d of allDoors()) {
    const w = wallById(d.wall); if (!w) continue; const dd = wdir(w), p = wpt(w, d.pos), o = w.t / 2 + 80;
    link(roomAt(p.x + dd.nx * o, p.y + dd.ny * o), roomAt(p.x - dd.nx * o, p.y - dd.ny * o), 'door');
  }
  for (const w of S.walls) if (w.kind === 'zone') {
    const dd = wdir(w); for (const f of [.2, .5, .8]) { const p = wpt(w, dd.L * f); link(roomAt(p.x + dd.nx * 90, p.y + dd.ny * 90), roomAt(p.x - dd.nx * 90, p.y - dd.ny * 90), 'zone'); }
  }
  const ent = [roomAt(7300, 100), roomAt(7300, H - 100)].filter(Boolean);
  ent.forEach((r) => r.entrance = true);
  const seen = new Set(ent), stack = [...ent];
  while (stack.length) { const r = stack.pop(); for (const n of r.links) if (!seen.has(n)) { seen.add(n); stack.push(n); } }
  for (const r of rooms) r.reach = seen.has(r);
  // окна
  for (const wi of WINDOWS) for (let s = wi.a + 50; s < wi.b; s += 100) {
    const p = wi.side === 'top' ? { x: s, y: 80 } : wi.side === 'bottom' ? { x: s, y: H - 80 } : wi.side === 'left' ? { x: 80, y: s } : { x: W - 80, y: s };
    const r = roomAt(p.x, p.y); if (r) r.windows++;
  }
  // имена и цвета, заданные игроком (привязаны к точкам)
  for (const a of S.rooms) { const r = roomAt(a.x, a.y); if (!r) continue; if (a.color !== undefined) r.color = a.color; if (a.name) r.name = a.name; }
  for (const r of rooms) { r.auto = autoName(r); r.title = r.name || r.auto; r.wet = r.boiler || ['toilet', 'bath', 'shower', 'sink', 'sink2'].some((t) => r.types.has(t)); }
  rooms.sort((a, b) => (Math.round(a.ly / 1500) - Math.round(b.ly / 1500)) || (a.lx - b.lx));
  rooms.forEach((r, i) => r.num = i + 1);

  A = { g, lab, rooms, roomAt, checks: runChecks(g, rooms, roomAt) };
}

function autoName(r) {
  const t = r.types, has = (x) => t.has(x);
  if (r.boiler) return 'Котельная';
  if (has('toilet')) return (has('bath') || has('shower')) ? 'Санузел' : 'Туалет';
  if (has('bath') || has('shower')) return 'Ванная';
  const kitchen = KITCHEN.some(has);
  if (kitchen && (has('sofa') || r.area > 18)) return 'Кухня-гостиная';
  if (kitchen) return 'Кухня';
  if (has('bed1') || has('bed2')) return 'Спальня';
  if (has('sofa')) return 'Гостиная';
  if (r.entrance && r.area < 15) return 'Прихожая';
  if (has('desk')) return 'Кабинет';
  if (has('wardrobe') && r.area < 7) return 'Гардероб';
  if (r.area < 9) return 'Коридор';
  return 'Комната';
}

function runChecks(g, rooms, roomAt) {
  const out = [];
  out.push({ ok: true, t: 'Котельная на месте', d: 'Стены, окно, дверь и оборудование котельной зафиксированы.' });

  const toilets = S.furn.filter((f) => f.type === 'toilet');
  const far = toilets.filter((f) => Math.min(...RISERS.map((r) => Math.hypot(f.x - r.x, f.y - r.y))) > TOILET_MAX);
  out.push({
    ok: toilets.length > 0 && !far.length, t: 'Санузел у стояков',
    d: !toilets.length ? 'В доме нет унитаза. Поставьте его в голубой зоне.' : far.length ? `Унитаз дальше ${fmtMM(TOILET_MAX)} мм от стояка — не будет уклона канализации.` : 'Унитазы рядом со стояками К1/В1.'
  });

  const wetRooms = rooms.filter((r) => r.types.has('toilet'));
  const badWet = wetRooms.filter((r) => r.open > 0 || !r.doors || [...r.types].some((x) => LIVING_FURN.has(x)));
  out.push({ ok: !badWet.length, t: 'Санузел отделён', d: badWet.length ? `${badWet.map((r) => '№' + r.num).join(', ')}: нужны стены, своя дверь и никакой жилой мебели.` : 'Санузлы закрыты стенами и дверьми.' });

  const lost = rooms.filter((r) => !r.reach && r.area >= 1);
  out.push({ ok: !lost.length, t: 'В каждое помещение можно войти', d: lost.length ? `Нет прохода от входа: ${lost.map((r) => r.title + ' №' + r.num).join(', ')}. Добавьте дверь.` : 'От входных дверей можно дойти до всех помещений.' });

  const dark = rooms.filter((r) => (r.types.has('bed1') || r.types.has('bed2') || r.types.has('sofa')) && !r.windows);
  out.push({ ok: !dark.length, t: 'Жилые комнаты с окном', d: dark.length ? `Без окна: ${dark.map((r) => r.title + ' №' + r.num).join(', ')}.` : 'У каждой спальни и гостиной есть окно.' });

  const blocked = [];
  for (const w of S.walls) if (w.kind === 'wall') for (const p of [{ x: w.x1, y: w.y1 }, { x: w.x2, y: w.y2 }]) {
    const side = p.y < 5 ? 'top' : p.y > H - 5 ? 'bottom' : p.x < 5 ? 'left' : p.x > W - 5 ? 'right' : null;
    if (!side) continue; const c = side === 'top' || side === 'bottom' ? p.x : p.y;
    for (const o of [...WINDOWS, ...ENTRANCES]) if (o.side === side && c + w.t / 2 > o.a + 1 && c - w.t / 2 < o.b - 1) blocked.push(w);
  }
  out.push({ ok: !blocked.length, t: 'Окна и входы свободны', d: blocked.length ? 'Перегородка упирается в окно или входную дверь — сдвиньте её.' : 'Перегородки примыкают к глухим участкам наружных стен.' });

  const inWall = [];
  for (const f of S.furn) {
    if (f.type === 'rug') continue;
    const a = f.rot * Math.PI / 180, c = Math.cos(a), s = Math.sin(a); let hits = 0, tot = 0;
    for (let u = -f.w / 2 + 30; u <= f.w / 2 - 30; u += 50) for (let v = -f.d / 2 + 30; v <= f.d / 2 - 30; v += 50) {
      const x = f.x + u * c - v * s, y = f.y + u * s + v * c, i = Math.floor(x / CELL), j = Math.floor(y / CELL); tot++;
      if (i >= 0 && j >= 0 && i < NX && j < NY && g[j * NX + i] === 1) hits++;
    }
    if (hits > 0) inWall.push(f);
  }
  out.push({ ok: !inWall.length, t: 'Мебель не заходит в стены', d: inWall.length ? `${inWall.map((f) => CAT[f.type].n).slice(0, 4).join(', ')}${inWall.length > 4 ? '…' : ''} пересекается со стеной.` : 'Вся мебель стоит свободно.', items: inWall.map((f) => f.id) });
  return out;
}

/* символы мебели (локальные координаты по центру, «спинка» вверху) */
function drawFurn(c, f, lw) {
  const w = f.w, d = f.d, L = -w / 2, Tp = -d / 2, R = w / 2, B = d / 2, type = f.type;
  c.lineWidth = lw; c.strokeStyle = C.ink; c.fillStyle = f.color || C.furn; c.lineJoin = 'round'; c.lineCap = 'round';
  const rr = (x, y, ww, hh, r = 0, fl = true) => { c.beginPath(); if (r > 0 && c.roundRect) c.roundRect(x, y, ww, hh, Math.max(0, Math.min(r, ww / 2, hh / 2))); else c.rect(x, y, ww, hh); if (fl) c.fill(); c.stroke(); };
  const ln = (x1, y1, x2, y2) => { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); };
  const el = (x, y, rx, ry, fl = true) => { c.beginPath(); c.ellipse(x, y, Math.max(rx, 1), Math.max(ry, 1), 0, 0, Math.PI * 2); if (fl) c.fill(); c.stroke(); };
  const X = (x, y, ww, hh) => { ln(x, y, x + ww, y + hh); ln(x + ww, y, x, y + hh); };
  switch (type) {
    case 'bed2': case 'bed1': {
      rr(L, Tp, w, d, 30); rr(L, Tp, w, 70);
      const n = type === 'bed2' ? 2 : 1, gap = 70, pw = (w - gap * (n + 1)) / n;
      for (let i = 0; i < n; i++) rr(L + gap + i * (pw + gap), Tp + 130, pw, Math.min(360, d * .18), 70);
      const by = Tp + d * .34; rr(L + 25, by, w - 50, B - by - 25, 25);
      ln(L + 25, by + Math.min(320, w * .3), L + 25 + Math.min(320, w * .3), by); break;
    }
    case 'nightstand': rr(L, Tp, w, d, 25); el(0, 30, Math.min(w, d) * .22, Math.min(w, d) * .22, false); break;
    case 'wardrobe': {
      rr(L, Tp, w, d); ln(L + 40, 0, R - 40, 0);
      for (let x = L + 90; x < R - 50; x += 90) ln(x - 25, Tp + d * .18, x + 25, B - d * .18); break;
    }
    case 'dresser': rr(L, Tp, w, d, 10); ln(L, B - 60, R, B - 60); break;
    case 'shelf': case 'ktall': case 'fridge': case 'boiler': rr(L, Tp, w, d); X(L, Tp, w, d); if (type === 'fridge') ln(L + w * .2, B - 40, R - w * .2, B - 40); break;

      const a = Math.min(220, w * .14), bk = Math.min(240, d * .27);
      rr(L, Tp, w, d, 70); rr(L, Tp, w, bk, 60); rr(L, Tp + bk, a, d - bk, 50); rr(R - a, Tp + bk, a, d - bk, 50);
      const n = type === 'sofa' ? Math.max(2, Math.round((w - 2 * a) / 750)) : 1, cw = (w - 2 * a) / n;
      for (let i = 1; i < n; i++) ln(L + a + i * cw, Tp + bk, L + a + i * cw, B - 40); break;
    }
    case 'coffee': rr(L, Tp, w, d, 60); break;
    case 'tv': rr(L, Tp, w, d); c.fillStyle = C.ink; rr(L + w * .12, Tp + 40, w * .76, 50); break;
    case 'rug': c.setLineDash([80, 60]); rr(L, Tp, w, d, 40); c.setLineDash([]); rr(L + 80, Tp + 80, w - 160, d - 160, 30, false); break;
    case 'plant': { el(0, 0, w / 2, d / 2); for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; el(Math.cos(a) * w * .22, Math.sin(a) * d * .22, w * .14, d * .14, false); } break; }
    case 'kbase': rr(L, Tp, w, d); ln(L, B - 50, R, B - 50); break;
    case 'ksink': rr(L, Tp, w, d); rr(L + w * .14, Tp + d * .2, w * .72, d * .56, 70); el(0, 30, 25, 25, false); el(0, Tp + 70, 30, 30); break;
    case 'khob': { rr(L, Tp, w, d); const r = Math.min(w, d) * .15; for (const [x, y] of [[-.22, -.22], [.22, -.22], [-.22, .22], [.22, .22]]) { el(x * w, y * d, r, r, false); el(x * w, y * d, r * .45, r * .45, false); } break; }
    case 'table': rr(L, Tp, w, d, 30); break;
    case 'roundtable': el(0, 0, w / 2, d / 2); break;
    case 'chair': rr(L + 25, Tp + 80, w - 50, d - 105, 60); rr(L, Tp, w, 90, 40); break;
    case 'desk': rr(L, Tp, w, d, 15); ln(L + 40, B - 60, L + w * .4, B - 60); break;
    case 'ochair': el(0, d * .06, w * .42, d * .4); rr(L + w * .12, Tp, w * .76, d * .2, 60); break;
    case 'toilet': rr(L, Tp, w, d * .27, 35); el(0, Tp + d * .27 + d * .36, w * .46, d * .36); el(0, Tp + d * .27 + d * .38, w * .3, d * .25, false); break;
    case 'sink': rr(L, Tp, w, d, 25); el(0, d * .05, w * .3, d * .3); el(0, Tp + 60, 25, 25); break;
    case 'sink2': rr(L, Tp, w, d, 25); for (const s of [-1, 1]) { el(s * w / 4, d * .05, w * .15, d * .3); el(s * w / 4, Tp + 60, 25, 25); } break;

/* привязка */
let shiftDown = false, spaceDown = false;
function snapPoint(p, from, ortho, skipId) {
  const tol = 14 / view.s, g = opt.grid; let q = { x: p.x, y: p.y };
  const walls = allWalls().filter((w) => w.id !== skipId);
  if (from && ortho) {
    const hz = Math.abs(p.x - from.x) >= Math.abs(p.y - from.y);
    if (hz) q.y = from.y; else q.x = from.x;
    const k = hz ? 'x' : 'y', fixedK = hz ? 'y' : 'x', fv = q[fixedK];
    const cands = [0, hz ? W : H];
    for (const w of walls) {
      for (const e of [1, 2]) if (Math.abs(w[fixedK + e] - fv) < 1) cands.push(w[k + e]);
      const a1 = w[fixedK + 1], a2 = w[fixedK + 2];
      if ((fv - a1) * (fv - a2) <= 0 && Math.abs(a1 - a2) > 1) { const t = (fv - a1) / (a2 - a1); cands.push(w[k + 1] + (w[k + 2] - w[k + 1]) * t); }
    }
    let best = null, bd = tol; for (const c of cands) { const dd = Math.abs(c - q[k]); if (dd < bd) { bd = dd; best = c; } }
    q[k] = best !== null ? best : Math.round(q[k] / g) * g;
  } else {
    let best = null, bd = tol;
    for (const w of walls) for (const e of [1, 2]) { const dd = Math.hypot(w['x' + e] - p.x, w['y' + e] - p.y); if (dd < bd) { bd = dd; best = { x: w['x' + e], y: w['y' + e] }; } }
    if (!best) {
      for (const w of walls) { const pr = segProj(p.x, p.y, w.x1, w.y1, w.x2, w.y2); if (pr.d < bd) { bd = pr.d; best = { x: pr.x, y: pr.y }; } }
      if (best) { const w2 = walls.find((w) => segProj(p.x, p.y, w.x1, w.y1, w.x2, w.y2).d === bd); if (w2 && w2.x1 === w2.x2) best.y = Math.round(best.y / g) * g; if (w2 && w2.y1 === w2.y2) best.x = Math.round(best.x / g) * g; }
    }
    if (best) q = best;
    else {
      q.x = Math.abs(q.x) < tol ? 0 : Math.abs(q.x - W) < tol ? W : Math.round(q.x / g) * g;
      q.y = Math.abs(q.y) < tol ? 0 : Math.abs(q.y - H) < tol ? H : Math.round(q.y / g) * g;
    }
  }
  return { x: clamp(q.x, 0, W), y: clamp(q.y, 0, H) };
}
function doorAt(p) {
  let best = null, bd = 400;
  for (const w of S.walls) { if (w.kind !== 'wall') continue; const pr = segProj(p.x, p.y, w.x1, w.y1, w.x2, w.y2); if (pr.d < Math.max(bd, 0) && pr.d < 400) { bd = pr.d; best = { w, pr }; } }
  if (!best) return null;

  let err = null; if (d.L < ww + 120) err = 'Стена короче дверного проёма';
  const s = clamp(pr.t * d.L, ww / 2 + 60, d.L - ww / 2 - 60);
  if (!err && S.doors.some((o) => o.wall === w.id && Math.abs(o.pos - s) < (o.w + ww) / 2 + 80)) err = 'Здесь уже есть дверь';
  const pp = wpt(w, s), side = (p.x - pp.x) * d.nx + (p.y - pp.y) * d.ny;
  return { w, s: Math.round(s / 10) * 10, swing: side >= 0 ? 1 : -1, err };

function delSel() {

  else if (sel.kind === 'wall') { if (FIXED_WALLS.some((w) => w.id === sel.id)) return toast('Стены котельной не удаляются'); mutate(() => { S.walls = S.walls.filter((w) => w.id !== sel.id); }); }
  else if (sel.kind === 'door') { if (FIXED_DOORS.some((d) => d.id === sel.id)) return toast('Дверь котельной не удаляется'); mutate(() => { S.doors = S.doors.filter((d) => d.id !== sel.id); }); }

function rotateSel() { if (sel?.kind !== 'furn') return; const f = S.furn.find((x) => x.id === sel.id); if (f) commitFurn(f.id, { rot: (Math.round(f.rot / 90) * 90 + 90) % 360 }); }

  if (furnError(n)) return toast(furnError(n));

/* клавиатура и кнопки */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Shift') shiftDown = true;
  if (e.target.matches('input,select,textarea')) return;
  if (e.code === 'Space') { spaceDown = true; e.preventDefault(); return; }
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (mod && (k === 'z' || k === 'я')) { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && (k === 'y' || k === 'н')) { e.preventDefault(); redo(); return; }
  if (mod && (k === 'd' || k === 'в')) { e.preventDefault(); dupSel(); return; }
  if (mod) return;
  if (k === 'escape') { if (chain) { chain = null; renderUI(); } else setSel(null); return; }
  if (k === 'delete' || k === 'backspace') { e.preventDefault(); delSel(); return; }
  const map = { v: 'select', м: 'select', w: 'wall', ц: 'wall', d: 'door', в: 'door', z: 'zone', я: 'zone', p: 'paint', з: 'paint' };
  if (map[k]) { setTool(map[k]); return; }
  if (k === 'r' || k === 'к') rotateSel();
  if (k === 'f' || k === 'а') flipDoor('swing');
  if (k === 'h' || k === 'р') flipDoor('hinge');
  const st = e.shiftKey ? 100 : 10;
  if (e.key === 'ArrowLeft') { e.preventDefault(); nudge(-st, 0); } if (e.key === 'ArrowRight') { e.preventDefault(); nudge(st, 0); }
  if (e.key === 'ArrowUp') { e.preventDefault(); nudge(0, -st); } if (e.key === 'ArrowDown') { e.preventDefault(); nudge(0, st); }
});
